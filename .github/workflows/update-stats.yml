name: Update NBA stats

on:
  schedule:
    # GitHub's timer is best-effort: it often fires hours late or skips a run entirely. So this checks every
    # hour from about 2 AM to noon Central; a check right after a recent update stops in a few seconds.
    # Times are UTC (subtract 5 hours for Central, 6 in winter).
    - cron: "23 6-12 * * *"    # backup only (the "Update clock" workflow normally starts updates); overnight, so it never bumps the daytime backfill
  workflow_dispatch: {}      # adds a "Run workflow" button on the Actions tab (always runs in full)

permissions:
  contents: write

concurrency:
  group: update-stats        # never run two updates at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Already updated recently?
        id: gate
        run: |
          last=$(git log -1 --author=stats-bot --grep="Daily stats update" --format=%ct || echo 0)
          age=$(( $(date +%s) - ${last:-0} ))
          echo "Last update was $((age / 60)) minutes ago"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$age" -lt 9000 ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "Updated within 2.5 hours; nothing to do"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != '1'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.gate.outputs.skip != '1'
        run: pip install beautifulsoup4 numpy

      - name: Pull last night's games and stats
        if: steps.gate.outputs.skip != '1'
        env:
          NO_BACKFILL: "1"
        run: python update_stats.py

      - name: Save the new numbers
        if: steps.gate.outputs.skip != '1'
        run: .github/scripts/save.sh "Daily stats update"

      - name: Fill in earlier seasons (career stats)
        if: steps.gate.outputs.skip != '1'
        run: python update_stats.py --backfill

      - name: Save the earlier seasons
        if: steps.gate.outputs.skip != '1'
        run: .github/scripts/save.sh "Career backfill"
