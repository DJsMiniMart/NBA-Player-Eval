name: Update NBA stats

on:
  schedule:
    - cron: "17 11 * * *"   # every day around 6:17 AM Central (after the night's games)
  workflow_dispatch: {}      # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install beautifulsoup4

      - name: Pull stats and run the formula
        run: python update_stats.py

      - name: Save the new numbers
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily stats update"
          git push
