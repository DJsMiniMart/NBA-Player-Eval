name: Fatigue study

# Goes through ESPN play-by-play for this season and the last 5 and files every player's production by how
# long he'd been on the floor (fatigue.py -> data/fatigue/). Each run has a time budget and starts the next
# run until every game is in; after that it only picks up new games (started daily by the "Update clock").
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [fatigue.py]

permissions:
  contents: write
  actions: write

concurrency:
  group: fatigue
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Go through play-by-play
        run: python fatigue.py
      - name: Save
        run: .github/scripts/save.sh "Fatigue study"
      - name: Start the next round (until every game is in)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(python -c "import json; print(json.load(open('data/fatigue/status.json')).get('left', 0))")
          echo "Games still to go: $left"
          if [ "$left" -gt 20 ]; then
            curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/fatigue.yml/dispatches" -d '{"ref":"${{ github.ref_name }}"}' && echo "Next round started"
          fi
