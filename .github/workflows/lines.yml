name: Refresh betting lines

# Quick in-between refresh (under a minute): the sportsbook lines and ESPN previews for the next
# week's games. Started every hour from about 10 AM to 11 PM Central by the "Update clock" workflow.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-lines
  cancel-in-progress: true

jobs:
  lines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get the latest lines
        run: python -c "import morning; morning.refresh_lines()"
      - name: Save them
        run: .github/scripts/save.sh "Lines update"
