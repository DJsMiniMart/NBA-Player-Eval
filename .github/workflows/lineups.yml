name: Defense test (lineups)

# Goes through ESPN play-by-play for the last 4 seasons and saves who was on the floor for every stretch of every
# game (lineups.py -> data/lineups/), for the individual-defense test. Each run has a time budget and starts the
# next run until every game is in.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [lineups.py]

permissions:
  contents: write
  actions: write

concurrency:
  group: lineups
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Go through play-by-play
        run: python lineups.py
      - name: Save
        run: .github/scripts/save.sh "Defense test (lineups)"
      - name: Start the next round (until every game is in)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(python -c "import json; print(json.load(open('data/lineups/status.json')).get('left', 0))")
          echo "Games still to go: $left"
          if [ "$left" -gt 20 ]; then
            curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/lineups.yml/dispatches" -d '{"ref":"${{ github.ref_name }}"}' && echo "Next round started"
          fi
