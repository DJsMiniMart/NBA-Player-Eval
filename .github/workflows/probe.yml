name: Probe trades
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - run: |
          python3 - <<'PY'
          import re, json
          from update_stats import fetch
          html = fetch("https://www.basketball-reference.com/leagues/NBA_2027_transactions.html")
          print("BBR len", len(html or ""))
          from bs4 import BeautifulSoup
          soup = BeautifulSoup(html or "", "html.parser")
          for li in soup.select("ul.page_index > li")[:6]:
              print("DATE", li.find("span").get_text() if li.find("span") else "")
              for p in li.find_all("p")[:6]:
                  if "trade" in p.get_text().lower(): print("  P:", str(p)[:900])
          import urllib.request
          for u in ["https://content.core.api.espn.com/v1/sports/news/50422647", "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/news?limit=50&player=4683724"]:
              try:
                  d = json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0"}), timeout=20).read())
                  print(u, json.dumps(d)[:1500])
              except Exception as e: print(u, e)
          PY
