<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchup · Full Court Geek Press</title>
<meta name="description" content="Everything about one NBA game: Pulse pick, tale of the tape, injuries with timetables, rest, players to watch, head-to-head, lines and storylines.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f2f4f8; --panel:#fff; --ink:#0f172a; --dim:#5b6475; --line:#dde2ea; --row:#f6f8fb; --accent:#C8102E; --court:#1D428A; --good:#2f9e44; --bad:#d6336c; --bad-soft:#fde4ec; --warn:#b7791f; --warn-soft:#fdf3dc; --a1:#1D428A; --h1:#C8102E; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0b1220; --panel:#121b2e; --ink:#e8edf6; --dim:#93a0b8; --line:#22304a; --row:#16213a; --accent:#ff4d63; --court:#7aa2ff; --good:#51cf66; --bad:#ff6b9a; --bad-soft:#3a1626; --warn:#f6c453; --warn-soft:#3a2f12; } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;}
  a{color:var(--court);}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px;}
  .hero{background:linear-gradient(100deg,var(--a1) 0 50%,var(--h1) 50% 100%);color:#fff;}
  .hero-in{padding:22px 16px 18px;}
  .back{color:#fff;opacity:.85;font-size:13px;text-decoration:none;font-weight:600;}
  .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-top:10px;}
  .tm{display:flex;align-items:center;gap:12px;} .tm.h{justify-content:flex-end;text-align:right;}
  .tm img{width:64px;height:64px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35));}
  .tm .nm{font:700 30px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.4px;}
  .tm .nm a{color:#fff;text-decoration:none;} .tm .nm a:hover{text-decoration:underline;}
  .tm small{display:block;font:500 13px Inter,sans-serif;opacity:.9;margin-top:4px;text-transform:none;letter-spacing:0;}
  .at{font:700 22px "Barlow Condensed",sans-serif;opacity:.85;text-align:center;}
  .at .sc{display:block;font-size:44px;line-height:1;opacity:1;}
  .when{margin-top:12px;text-align:center;font-size:13.5px;opacity:.92;}
  .probbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:14px auto 6px;max-width:640px;border:2px solid rgba(255,255,255,.6);}
  .probbar i{display:block;} .probtxt{text-align:center;font-size:13px;font-weight:600;}
  main{padding:8px 0 60px;}
  h2{font:700 21px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.6px;margin:24px 0 10px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .card .pad{padding:12px 14px;}
  .note{color:var(--dim);font-size:12px;}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px;}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);font-weight:700;}
  .tape td{text-align:center;} .tape td.k{color:var(--dim);font-size:12.5px;font-weight:600;width:34%;}
  .tape td.win{font-weight:700;color:var(--good);} .tape td small{display:block;color:var(--dim);font-size:10.5px;font-weight:500;}
  .tape thead th img{width:26px;height:26px;vertical-align:middle;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;}
  .chip{background:var(--row);border-radius:10px;padding:8px 12px;font-size:13px;}
  .chip b{display:block;font:700 20px "Barlow Condensed",sans-serif;}
  .inj{padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px;}
  .inj:last-child{border-bottom:0;}
  .inj .st{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:6px;}
  .st.out{background:var(--bad-soft);color:var(--bad);} .st.dtd{background:var(--warn-soft);color:var(--warn);}
  .inj .tl{display:block;font-weight:700;margin-top:2px;font-size:12.5px;}
  .inj .why{display:block;color:var(--dim);font-size:12px;margin-top:2px;}
  .tmhead{display:flex;align-items:center;gap:8px;padding:10px 14px;font:700 16px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);background:var(--row);}
  .tmhead img{width:24px;height:24px;}
  .pl td:first-child{font-weight:600;} .pl td{text-align:right;} .pl td:first-child,.pl th:first-child{text-align:left;}
  .pl .ev{font-weight:700;color:var(--accent);}
  .h2h li{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .h2h ul{list-style:none;margin:0;padding:0;} .h2h li:last-child{border-bottom:0;}
  .h2h .w{font-weight:700;}
  .lines{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px;}
  .lines div{background:var(--row);border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--dim);}
  .lines div b{display:block;font:700 19px "Barlow Condensed",sans-serif;color:var(--ink);}
  .vegas{margin:0 14px 10px;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--row);}
  .mp{padding:4px 14px 14px;} .mp .r{display:grid;grid-template-columns:64px 1fr 1fr;gap:6px;align-items:center;margin-top:6px;font-size:12px;}
  .mp .r span{color:var(--dim);font-weight:600;}
  .mp button{font:600 12.5px Inter,sans-serif;padding:7px 4px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;}
  .mp button.on{background:var(--accent);border-color:var(--accent);color:#fff;} .mp button:disabled{opacity:.55;cursor:default;} .mp button.on:disabled{opacity:1;}
  .stories{list-style:none;margin:0;padding:6px 0;} .stories li{display:flex;gap:10px;padding:8px 14px;font-size:13.5px;}
  .empty{padding:14px;color:var(--dim);}
  .final{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px;font-weight:600;}
  @media (max-width:760px){ .grid{grid-template-columns:1fr;} .tm img{width:44px;height:44px;} .tm .nm{font-size:22px;} .at .sc{font-size:32px;} .teams{gap:6px;} }
</style>
</head>
<body>
<header class="hero"><div class="wrap hero-in" id="hero"><a class="back" href="index.html#upSec">← The Morning Press</a><div class="empty" style="color:#fff">Loading the matchup…</div></div></header>
<main class="wrap" id="main"></main>
<script src="nav.js"></script>
<script src="player.js"></script>
<script src="hotstart.js"></script>
<script src="injuries.js"></script>
<script src="mypicks.js"></script>
<script src="clips.js"></script>
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TEAMS = (window.PlayerPage && PlayerPage.TEAMS) || {};
const get = p => fetch(p + "?t=" + Math.floor(Date.now() / 6e4)).then(r => r.ok ? r.json() : null).catch(() => null);
const nick = c => { const n = (TEAMS[c] && TEAMS[c].n) || c; return /Trail Blazers$/.test(n) ? "Trail Blazers" : n.split(" ").slice(-1)[0]; };
const logo = c => window.teamBadge ? teamBadge(c) : "";
const sgn = n => n == null ? "—" : (n > 0 ? "+" : "") + (Number.isInteger(n) ? n : n.toFixed(1));
const f1 = v => v == null || !isFinite(v) ? "—" : v.toFixed(1);
const pctTxt = v => v == null || !isFinite(v) ? "—" : (v * 100).toFixed(1) + "%";
const day = d => new Date(String(d).slice(0, 10) + "T12:00:00").toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"});
const prod = s => s.pts + 2 * s.ast + 2 * (s.oreb + s.dreb) + 4 * s.stl + s.blk - 4 * s.tov;

async function load(){
  const gid = decodeURIComponent(location.hash.replace("#", ""));
  const [S, P, M, L, PL, H] = await Promise.all([get("data/schedule.json"), get("data/predictions.json"), get("data/morning.json"),
    get("data/teams/league.json"), get("data/teams/players.json"), get("data/h2h.json")]);
  await Promise.all([window.HotStart && HotStart.ready, window.Injuries && Injuries.ready, window.PlayerIndex && PlayerIndex.ready, window.Clips && Clips.ready]);
  const g = ((S && S.games) || []).find(x => x[0] === gid);
  if(!g){ $("hero").innerHTML = `<a class="back" href="index.html#upSec">← The Morning Press</a><div class="empty" style="color:#fff">Couldn't find that game. It may be from an older schedule.</div>`; return; }
  const [ , when, home, away, state, hs, as_, arena, tv] = g;
  document.title = `${nick(away)} at ${nick(home)} · Matchup · Full Court Geek Press`;
  document.documentElement.style.setProperty("--a1", (TEAMS[away] || {}).c1 || "#1D428A");
  document.documentElement.style.setProperty("--h1", (TEAMS[home] || {}).c1 || "#C8102E");
  const U = ((P && P.upcoming) || []).find(x => x.id === gid);
  const O = M && M.odds && M.odds[gid];
  const T = teamStats(L, S);
  const t0 = new Date(when);

  // ---------- hero ----------
  const rec = c => T[c] ? `${T[c].w}-${T[c].l}` : "";
  const pa = U ? (U.pick === away ? U.p : 1 - U.p) : null;
  $("hero").innerHTML = `<a class="back" href="index.html#upSec">← The Morning Press</a>
    <div class="teams">
      <div class="tm"><img src="${logo(away)}" alt=""><div class="nm"><a href="team.html#${away}">${esc(nick(away))}</a><small>${rec(away)} · away</small></div></div>
      <div class="at">${state === 3 ? `<span class="sc">${as_}–${hs}</span>FINAL` : "@"}</div>
      <div class="tm h"><div class="nm"><a href="team.html#${home}">${esc(nick(home))}</a><small>${rec(home)} · home</small></div><img src="${logo(home)}" alt=""></div>
    </div>
    <div class="when">${esc(t0.toLocaleString("en-US", {weekday:"long", month:"long", day:"numeric", hour:"numeric", minute:"2-digit"}))}${arena ? " · " + esc(arena) : ""}${tv ? " · " + esc(String(tv).split(",").slice(0, 2).join(", ")) : ""}</div>
    ${U ? `<div class="probbar" title="Pulse win chances"><i style="width:${(pa * 100).toFixed(1)}%;background:var(--a1)"></i><i style="width:${((1 - pa) * 100).toFixed(1)}%;background:var(--h1)"></i></div>
      <div class="probtxt">Pulse: ${esc(nick(away))} ${Math.round(pa * 100)}% · ${esc(nick(home))} ${Math.round((1 - pa) * 100)}%${U.margin != null ? ` · Pulse line: ${esc(U.margin >= 0 ? home : away)} by ${Math.abs(U.margin).toFixed(1)}` : ""}</div>` : ""}`;

  let html = "";
  if(state === 3) html += `<div class="final">Final: ${esc(away)} ${as_}, ${esc(home)} ${hs}. <a href="index.html">Box scores are on The Morning Press →</a></div>`;

  // ---------- highlights: this game when it's over, else each team's last game ----------
  if(window.Clips){
    const mine = Clips.forGame(gid);
    if(state === 3 && mine.length) html += `<h2>Highlights</h2><div class="card pad">${Clips.strip(mine)}</div>`;
    else if(state !== 3){
      const lastOf = t => ((S && S.games) || []).filter(x => x[4] === 3 && (x[2] === t || x[3] === t)).sort((a, b) => String(b[1]).localeCompare(String(a[1])))[0];
      const parts = [away, home].map(t => { const lg = lastOf(t); const c = lg ? Clips.forGame(lg[0]) : [];
        return c.length ? c.slice(0, 4).map(x => ({h: x[1], u: x[2], t: x[3], s: x[4], sub: `${t}'s last game: ${lg[3]} @ ${lg[2]}`})) : []; }).flat();
      if(parts.length) html += `<h2>Catch up: last game highlights</h2><div class="card pad">${Clips.strip(parts)}</div>`;
    }
  }

  // ---------- projected score ----------
  if(U && O && O.total != null && U.margin != null && state !== 3){
    const hp = (O.total + U.margin) / 2, ap = (O.total - U.margin) / 2;
    html += `<h2>Projected score</h2><div class="card"><div class="chips">
      <div class="chip"><b>${esc(away)} ${Math.round(ap)}</b>away</div><div class="chip"><b>${esc(home)} ${Math.round(hp)}</b>home</div>
      <div class="chip"><b>${esc(U.pick)} ${Math.round(U.p * 100)}%</b>Pulse pick</div></div>
      <div class="pad note" style="padding-top:0">Pulse's projected margin (${esc(U.margin >= 0 ? home : away)} by ${Math.abs(U.margin).toFixed(1)}) split around the sportsbook total (${O.total}). Pulse doesn't project totals on its own.</div></div>`;
  }

  // ---------- tale of the tape ----------
  html += `<h2>Tale of the tape</h2>` + tapeHtml(T, away, home, P);

  // ---------- rest ----------
  html += `<h2>Rest &amp; schedule</h2><div class="grid">${restHtml(S, away, t0)}${restHtml(S, home, t0)}</div>`;

  // ---------- injuries ----------
  html += `<h2>Injuries</h2><div class="grid">${injHtml(away, U)}${injHtml(home, U)}</div>`;
  if(U && U.lineup){ const bits = [away, home].flatMap(t => ((U.lineup[t] && U.lineup[t][1]) || []).map(([nm, q, pts]) => `${playerLink(nm, t)}${q < 1 ? ` (${Math.round(q * 100)}% likely out)` : ""} −${pts.toFixed(1)} pts`));
    if(bits.length) html += `<p class="note">🩹 Pulse's pick already accounts for these absences: ${bits.join(" · ")}.</p>`; }

  // ---------- players to watch ----------
  html += `<h2>Players to watch</h2><div class="grid">${playersHtml(PL, away)}${playersHtml(PL, home)}</div>`;

  // ---------- head-to-head ----------
  html += `<h2>Head-to-head</h2>` + h2hHtml(H, away, home);

  // ---------- lines + your pick ----------
  html += `<h2>Lines &amp; your pick</h2>` + linesHtml(O, U, away, home, g);

  // ---------- storylines ----------
  const st = (U && U.stories) || [];
  const ICON = {rivalry:"⚔️", division:"🏟️", rematch:"🔁", streak:"📈", race:"🏁", revenge:"🔄", stars:"⭐", rookies:"🆕", rest:"😴", preview:"📰", note:"💬"};
  if(st.length) html += `<h2>Storylines</h2><div class="card"><ul class="stories">${st.map(([k, t, u]) => `<li><span>${ICON[k] || "•"}</span><div>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>` : esc(t)}</div></li>`).join("")}</ul></div>`;
  html += `<p class="note" style="margin-top:20px">Pulse picks use each team's Pulse margin, home court and who's sitting. Lines from ${esc((O && O.book) || "the sportsbook")} via ESPN; for information only, 21+. Gambling problem? Call 1-800-GAMBLER.</p>`;
  $("main").innerHTML = html;
  wirePicks(O, U, g);
}

function teamStats(L, S){
  const C = (L && L.cols) || [], ix = k => C.indexOf(k), T = {};
  const add = (t, me, op, win, home) => {
    const x = T[t] || (T[t] = {g:0, w:0, l:0, hw:0, hl:0, aw:0, al:0, pts:0, opp:0, poss:0, oposs:0, fg3m:0, fg3a:0, reb:0, tov:0, prodF:0, prodA:0, res:[]});
    const v = k => me[ix(k)] || 0, o = k => op[ix(k)] || 0;
    x.g++; win ? x.w++ : x.l++; if(home) win ? x.hw++ : x.hl++; else win ? x.aw++ : x.al++;
    x.pts += v("pts"); x.opp += o("pts");
    x.poss += v("fga") - v("oreb") + v("tov") + .44 * v("fta"); x.oposs += o("fga") - o("oreb") + o("tov") + .44 * o("fta");
    x.fg3m += v("fg3m"); x.fg3a += v("fg3a"); x.reb += v("oreb") + v("dreb"); x.tov += v("tov");
    const pr = a => (a[ix("pts")] || 0) + 2 * (a[ix("ast")] || 0) + 2 * ((a[ix("oreb")] || 0) + (a[ix("dreb")] || 0)) + 4 * (a[ix("stl")] || 0) + (a[ix("blk")] || 0) - 4 * (a[ix("tov")] || 0);
    x.prodF += pr(me); x.prodA += pr(op); x.res.push(win);
  };
  ((L && L.games) || []).slice().sort((a, b) => String(a[1]).localeCompare(String(b[1]))).forEach(g => {
    const [ , , h, a, hl, al] = g; if(!hl || !al) return;
    const hw = hl[ix("pts")] > al[ix("pts")];
    add(h, hl, al, hw, true); add(a, al, hl, !hw, false);
  });
  Object.values(T).forEach(x => {
    const p = (x.poss + x.oposs) / 2 || 1;
    Object.assign(x, {ppg: x.pts / x.g, opg: x.opp / x.g, ortg: x.pts / p * 100, drtg: x.opp / p * 100, net: (x.pts - x.opp) / p * 100,
      pace: p / x.g, fg3: x.fg3a ? x.fg3m / x.fg3a : null, rpg: x.reb / x.g, tpg: x.tov / x.g, pulse: (x.prodF - x.prodA) / x.g,
      l10: x.res.slice(-10), streak: (() => { let n = 0, w = x.res[x.res.length - 1]; for(let i = x.res.length - 1; i >= 0 && x.res[i] === w; i--) n++; return (w ? "W" : "L") + n; })()});
  });
  return T;
}
function rank(T, c, k, low){
  const vals = Object.entries(T).filter(([, x]) => x[k] != null).sort((a, b) => low ? a[1][k] - b[1][k] : b[1][k] - a[1][k]);
  const i = vals.findIndex(([t]) => t === c); return i < 0 ? null : i + 1;
}
function tapeHtml(T, a, h, P){
  const A = T[a], H = T[h];
  if(!A || !H) return `<div class="card empty">Team stats show up after both teams have played.</div>`;
  const R = (P && P.ratings) || {};
  const rows = [
    ["Record", x => `${x.w}-${x.l}`, x => x.w / x.g],
    ["Home / road record", (x, t) => t === h ? `${x.hw}-${x.hl} home` : `${x.aw}-${x.al} road`, (x, t) => t === h ? x.hw / Math.max(1, x.hw + x.hl) : x.aw / Math.max(1, x.aw + x.al)],
    ["Last 10", x => `${x.l10.filter(Boolean).length}-${x.l10.filter(v => !v).length}`, x => x.l10.filter(Boolean).length / Math.max(1, x.l10.length)],
    ["Streak", x => x.streak, null],
    ["Pulse rating", (x, t) => R[t] != null ? sgn(Math.round(R[t] * 10) / 10) : "—", (x, t) => R[t], "pulseR"],
    ["Points per game", x => f1(x.ppg), x => x.ppg, "ppg"],
    ["Points allowed", x => f1(x.opg), x => -x.opg, "opg", true],
    ["Net rating (per 100)", x => sgn(Math.round(x.net * 10) / 10), x => x.net, "net"],
    ["Offense (pts per 100)", x => f1(x.ortg), x => x.ortg, "ortg"],
    ["Defense (allowed per 100)", x => f1(x.drtg), x => -x.drtg, "drtg", true],
    ["Pace (possessions)", x => f1(x.pace), null, "pace"],
    ["3-point %", x => pctTxt(x.fg3), x => x.fg3, "fg3"],
    ["Rebounds", x => f1(x.rpg), x => x.rpg, "rpg"],
    ["Turnovers", x => f1(x.tpg), x => -x.tpg, "tpg", true],
  ];
  Object.entries(R).forEach(([t, v]) => { if(T[t]) T[t].pulseR = v; });
  return `<div class="card"><table class="tape"><thead><tr><th><img src="${logo(a)}" alt=""> ${esc(a)}</th><th></th><th>${esc(h)} <img src="${logo(h)}" alt=""></th></tr></thead><tbody>${rows.map(([k, fmt, better, rk, low]) => {
    const va = better ? better(A, a) : null, vh = better ? better(H, h) : null, wa = va != null && vh != null && va > vh, wh = va != null && vh != null && vh > va;
    const r = t => rk ? (() => { const n = rank(T, t, rk, low); return n ? `<small>${n}${["th","st","nd","rd"][(n % 100 > 10 && n % 100 < 14) ? 0 : n % 10] || "th"} of ${Object.keys(T).length}</small>` : ""; })() : "";
    return `<tr><td class="${wa ? "win" : ""}">${fmt(A, a)}${r(a)}</td><td class="k">${k}</td><td class="${wh ? "win" : ""}">${fmt(H, h)}${r(h)}</td></tr>`; }).join("")}</tbody></table>
    <div class="pad note">This season. Green = the better number. Ranks are out of every team that has played.</div></div>`;
}
function restHtml(S, t, t0){
  const games = ((S && S.games) || []).filter(g => (g[2] === t || g[3] === t)).sort((a, b) => String(a[1]).localeCompare(String(b[1])));
  const before = games.filter(g => new Date(g[1]) < t0 - 36e5), last = before[before.length - 1];
  const after = games.find(g => new Date(g[1]) > t0.getTime() + 36e5);
  const days = last ? Math.round((t0 - new Date(last[1])) / 864e5) : null;
  const wk = before.filter(g => t0 - new Date(g[1]) < 7 * 864e5).length;
  const tag = days == null ? "First game" : days <= 1 ? "😴 Back-to-back (played yesterday)" : `${days - 1} day${days - 1 === 1 ? "" : "s"} of rest`;
  const opp = g => g[2] === t ? `vs ${g[3]}` : `@ ${g[2]}`;
  return `<div class="card"><div class="tmhead"><img src="${logo(t)}" alt="">${esc(nick(t))}</div><div class="chips">
    <div class="chip"><b>${esc(tag)}</b>${last ? `last: ${esc(opp(last))}, ${esc(new Date(last[1]).toLocaleDateString("en-US", {month:"short", day:"numeric"}))}` : ""}</div>
    <div class="chip"><b>${wk}</b>games in the last 7 days</div>
    ${after ? `<div class="chip"><b>${esc(opp(after))}</b>next, ${esc(new Date(after[1]).toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"}))}${Math.round((new Date(after[1]) - t0) / 864e5) <= 1 ? " (back-to-back)" : ""}</div>` : ""}</div></div>`;
}
function injHtml(t, U){
  const d = window.Injuries && Injuries.data(), list = ((d && d.teams && d.teams[t]) || []).filter(x => !/^active$/i.test(x.status || ""));
  const rows = list.map(x => { const s = String(x.status || "").toLowerCase(), cls = s.includes("out") ? "out" : "dtd";
    const what = [x.side, x.type, x.detail].filter(Boolean).join(" "), wh = Injuries.when(x);
    return `<div class="inj">${playerLink(x.name, t)}<span class="st ${cls}">${esc(x.status)}</span>${wh ? `<span class="tl">⏱ ${esc(wh)}</span>` : ""}<span class="why">${what ? esc(what) + ". " : ""}${esc(x.note || "")} ${x.link ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">${x.story ? "Story →" : "ESPN →"}</a>` : ""}</span></div>`; }).join("");
  return `<div class="card"><div class="tmhead"><img src="${logo(t)}" alt="">${esc(nick(t))}</div>${rows || `<div class="empty">No injuries reported.</div>`}</div>`;
}
function playersHtml(PL, t){
  const C = (PL && PL.cols) || [], ix = k => C.indexOf(k);
  const rows = ((PL && PL.players) || []).filter(r => r[ix("team")] === t && r[ix("g")] > 0).map(r => {
    const s = k => r[ix(k)] || 0, min = s("min"), g = s("g");
    return {name: r[ix("name")], g, mpg: min / g, ppg: s("pts") / g, rpg: (s("dreb") + s("oreb")) / g, apg: s("ast") / g,
      pulse: min ? prod({pts:s("pts"), ast:s("ast"), oreb:s("oreb"), dreb:s("dreb"), stl:s("stl"), blk:s("blk"), tov:s("tov")}) / min : null};
  }).filter(r => r.mpg >= 15).sort((a, b) => (b.pulse || 0) - (a.pulse || 0)).slice(0, 5);
  const body = rows.map(r => { const id = window.PlayerIndex && PlayerIndex.id(r.name, t); const e = window.Injuries && Injuries.find(t, r.name);
    return `<tr><td>${playerLink(r.name, t, null, id)}${id && window.HotStart ? HotStart.chip(id, {small: true}) : ""}${e && !/^active$/i.test(e.status) ? ` <span class="st ${/out/i.test(e.status) ? "out" : "dtd"}" style="font-size:10px;padding:1px 6px;border-radius:999px">${esc(e.status)}</span>` : ""}</td><td>${f1(r.mpg)}</td><td>${f1(r.ppg)}</td><td>${f1(r.rpg)}</td><td>${f1(r.apg)}</td><td class="ev">${r.pulse != null ? r.pulse.toFixed(3) : "—"}</td></tr>`; }).join("");
  return `<div class="card"><div class="tmhead"><img src="${logo(t)}" alt="">${esc(nick(t))}</div>${body ? `<div style="overflow-x:auto"><table class="pl"><thead><tr><th>Player</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>Pulse</th></tr></thead><tbody>${body}</tbody></table></div>` : `<div class="empty">Not enough games yet.</div>`}<div class="pad note">Top 5 by Pulse this season (15+ minutes a game).</div></div>`;
}
function h2hHtml(H, a, h){
  const key = [a, h].sort().join("-"), list = (H && H.pairs && H.pairs[key]) || [];
  if(!list.length) return `<div class="card empty">These teams haven't met in the last ${(H && H.seasons || []).length || 3} seasons.</div>`;
  const wins = t => list.filter(([, hh, aa, hs, as_]) => (hs > as_ ? hh : aa) === t).length;
  return `<div class="card h2h"><div class="chips"><div class="chip"><b>${esc(a)} ${wins(a)} – ${wins(h)} ${esc(h)}</b>since ${esc((H.seasons || [])[0] || "")}</div></div><ul>${list.slice(0, 12).map(([d, hh, aa, hs, as_, ot]) => {
    const w = hs > as_ ? hh : aa;
    return `<li><span>${esc(day(d))}</span><span><span class="${w === aa ? "w" : ""}">${esc(aa)} ${as_}</span> @ <span class="${w === hh ? "w" : ""}">${esc(hh)} ${hs}</span>${ot ? ` (${ot > 1 ? ot : ""}OT)` : ""}</span></li>`; }).join("")}</ul></div>`;
}
function linesHtml(O, U, a, h, g){
  if(!O) return `<div class="card empty">No betting lines posted yet. They usually show up the day before.</div>`;
  const fav = O.spread == null ? null : O.spread <= 0 ? h : a;
  let ats = "";
  if(U && U.margin != null && O.spread != null){ const side = U.margin + O.spread > 0 ? h : a, line = side === h ? O.spread : -O.spread;
    ats = `<div class="vegas">📏 Against the spread, Pulse takes <b>${esc(side)} ${line === 0 ? "PK" : sgn(line)}</b> (Pulse line: ${esc(U.margin >= 0 ? h : a)} by ${Math.abs(U.margin).toFixed(1)})</div>`; }
  return `<div class="card"><div class="lines"><div><b>${O.spread == null ? "—" : O.spread === 0 ? "PK" : `${esc(fav)} ${sgn(-Math.abs(O.spread))}`}</b>spread${O.open && O.open.spread != null ? ` · opened ${sgn(O.open.spread)}` : ""}</div>
    <div><b>${O.total ?? "—"}</b>total${O.open && O.open.total != null ? ` · opened ${O.open.total}` : ""}</div>
    <div><b>${esc(a)} ${sgn(O.mlAway)}</b>${esc(h)} ${sgn(O.mlHome)}</div></div>${ats}<div class="mp" id="mp"></div></div>`;
}
function wirePicks(O, U, g){
  const box = $("mp"); if(!box || !window.MyPicks || !O) return;
  const u = U || {id: g[0], t: g[1], home: g[2], away: g[3]};
  const draw = () => {
    const opts = MyPicks.options(u, O), locked = MyPicks.started(u.t);
    const btn = x => { const cur = MyPicks.pickOf(u.id, x.type), on = cur && cur.side === x.side;
      const txt = x.type === "ml" ? `${esc(x.side)} ${sgn(x.odds)}` : x.type === "spread" ? `${esc(x.side)} ${x.line === 0 ? "PK" : sgn(x.line)}` : `${x.side === "over" ? "Over" : "Under"} ${x.line}`;
      return `<button class="${on ? "on" : ""}" data-t="${x.type}" data-s="${esc(x.side)}"${locked ? " disabled" : ""}>${txt}</button>`; };
    const row = (t, l) => { const r = opts.filter(x => x.type === t); return r.length ? `<div class="r"><span>${l}</span>${r.map(btn).join("")}</div>` : ""; };
    box.innerHTML = `<div class="note" style="font-weight:700;margin-top:4px">🎯 Your pick${locked ? " · locked" : ""} · <a href="picks.html">My record →</a></div>${row("ml", "Winner")}${row("spread", "Spread")}${row("total", "Total")}`;
    box.querySelectorAll("button[data-t]").forEach(b => b.onclick = () => { const r = MyPicks.toggle(u, O, b.dataset.t, b.dataset.s); draw(); if(!r.ok){ const n = document.createElement("div"); n.className = "note"; n.style.color = "var(--bad)"; n.textContent = r.why; box.appendChild(n); } });
  };
  draw();
}
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); load(); });
load();
})();
